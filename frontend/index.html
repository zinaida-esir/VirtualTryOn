<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Virtual Try On</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&family=Cormorant+Garamond:wght@500;600&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <!-- Page header and authentication buttons -->
  <header class="topbar">
    <div class="top-inner">

      <div class="brand">
        <h1>Virtual Try On</h1>
        <p>AI Clothing Visualization</p>
      </div>

      <div class="auth-area">

        <div id="guest-auth">
          <button class="ghost auth-button" id="open-login-btn" type="button">
            Log in
          </button>

          <button class="primary auth-button" id="open-register-btn" type="button">
            Register
          </button>
        </div>

        <div id="user-auth" hidden>
          <span id="current-user-email"></span>

          <button class="ghost auth-button" id="logout-btn" type="button">
            Log out
          </button>
        </div>

      </div>
    </div>
  </header>

  <!-- Login and registration window -->
  <div class="auth-modal" id="auth-modal" hidden>
    <div class="auth-modal-backdrop" id="auth-modal-backdrop"></div>

    <div class="auth-dialog">

      <button class="auth-close" id="auth-close-btn" type="button" aria-label="Close">
        ×
      </button>

      <h2 id="auth-title">Log in</h2>

      <form id="auth-form">

        <div class="field">
          <label for="auth-email">
            Email
          </label>

          <input class="input" id="auth-email" type="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="auth-password">
            Password
          </label>

          <input class="input" id="auth-password" type="password" minlength="6" autocomplete="current-password"
            required>
        </div>

        <div class="auth-error" id="auth-error"></div>

        <button class="primary" id="auth-submit-btn" type="submit">
          Log in
        </button>
      </form>

      <button class="auth-switch" id="auth-switch-btn" type="button">
        Create an account
      </button>

    </div>
  </div>

  <!-- Main application content -->
  <main class="page">

    <!-- Upload and generated result section -->
    <section class="main-grid" id="tryon">

      <div class="card">

        <h3>Inputs</h3>

        <div class="field">

          <label>
            Person image
          </label>

          <div class="drop" id="drop-person">

            <div class="thumb" id="thumb-person">
              <svg viewBox="0 0 24 24">
                <path d="M20 21a8 8 0 0 0-16 0"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>

            <div>

              <div class="drop-title">
                Upload person
              </div>

              <div class="drop-subtitle">
                JPG / PNG
              </div>

              <div class="row">

                <input id="person-input" type="file" accept="image/*">

                <button class="ghost" id="upload-person-btn" type="button">
                  Upload
                </button>

                <button class="ghost" id="clear-person-btn" type="button">
                  Clear
                </button>

              </div>
            </div>
          </div>
        </div>

        <div class="field">

          <label>
            Garment image
          </label>

          <div class="drop" id="drop-cloth">

            <div class="thumb" id="thumb-cloth">
              <svg viewBox="0 0 24 24">
                <path d="M12 7a2 2 0 1 0-2-2"></path>
                <path d="M12 7v3"></path>
                <path d="M5 20h14l-7-8z"></path>
              </svg>
            </div>

            <div>

              <div class="drop-title">
                Upload garment
              </div>

              <div class="drop-subtitle">
                JPG / PNG
              </div>

              <div class="row">

                <input id="cloth-input" type="file" accept="image/*">

                <button class="ghost" id="upload-cloth-btn" type="button">
                  Upload
                </button>

                <button class="ghost" id="clear-cloth-btn" type="button">
                  Clear
                </button>

              </div>
            </div>
          </div>
        </div>

        <div class="field">

          <label for="store-link">
            Store link
            <span class="label-optional">
              (optional)
            </span>
          </label>

          <input id="store-link" class="input" type="url" placeholder="https://example.com/item">

        </div>

        <button class="primary" id="try-btn" type="button">
          Generate
        </button>

        <div class="status" id="status">
          Ready
        </div>

      </div>

      <div class="card result-card" id="result">

        <h3>Result</h3>

        <div class="result-layout">

          <div>

            <div class="result-box">

              <div class="result-shine"></div>

              <div class="result-display" id="result-display">
                <span>
                  Result will appear here
                </span>
              </div>

            </div>

            <div class="actions">

              <button class="ghost" id="download-btn" type="button" disabled>
                Download
              </button>

              <button class="primary" id="save-btn" type="button" disabled>
                Save Result
              </button>

            </div>
          </div>

          <div class="preview-stack">

            <div>

              <label>
                Person preview
              </label>

              <div class="preview-box" id="preview-person-box"></div>

            </div>

            <div>

              <label>
                Garment preview
              </label>

              <div class="preview-box" id="preview-cloth-box"></div>

            </div>

          </div>
        </div>
      </div>

    </section>

    <!-- Saved wardrobe and recommended brands -->
    <section class="archive">

      <div class="card" id="wardrobe">

        <div class="section-head">

          <div>
            <div class="section-title">
              Wardrobe
            </div>
          </div>

          <div class="section-note">
            View all
          </div>

        </div>

        <div class="wardrobe-grid" id="wardrobe-grid"></div>

      </div>

      <div class="card" id="brands">

        <div class="section-head">

          <div>
            <div class="section-title">
              Brands
            </div>
          </div>

          <div class="section-note">
            View all
          </div>

        </div>

        <div class="brands-grid" id="brands-grid"></div>

      </div>

    </section>
  </main>

  <!-- Page footer -->
  <div class="footer">
    © 2026 Virtual Try On
  </div>

  <script src="./script.js"></script>
</body>

</html>
